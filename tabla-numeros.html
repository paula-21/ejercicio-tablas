<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <title>Ejercicio de una tabla (Números)</title>
    <style>
        td {
            background-color: bisque;
            width: 130px;
            height: 70px;
            text-align: center;
        }
        caption{
            caption-side: bottom;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Ejercicio de una tabla</h2>
    <table>
        
      <tr>
        <td>1</td>
        <td>2</td>
        <td colspan="2">3</td>
        <td>4</td>
      </tr>
      <tr>
        <td>5</td>
        <td rowspan="2">
          <ul>
            <li>5.1</li>
            <li>5.2</li>
            <li>5.3</li>
          </ul>
        </td>
        <td>8</td>
        <td colspan="2">
          <ol>
            <li>10.1</li>
            <li>10.2</li>
            <li>10.3</li>
          </ol>
        </td>
      </tr>
      <tr>
        <td>10</td>
        <td rowspan="2">
          <dl>
            <dt>11.1</dt>
            <dd>11.1.1</dd>
            <dt>11.2</dt>
            <dd>11.2.1</dd>
            <dt>11.3</dt>
            <dd>11.3.1</dd>
          </dl>
        </td>
        <td>12</td>
        <td>13</td>
      </tr>
      <tr>
        <td>14</td>
        <td>15</td>
        <td colspan="2">16</td>
      </tr>
      <caption>CAPTION DE LA TABLA</caption>
    </table>
</body>
</html>
