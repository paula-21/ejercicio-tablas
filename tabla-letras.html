<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <title>Ejercicio de una tabla</title>
    <style>
        td {
            background-color: aliceblue;
            width: 130px;
            height: 70px;
            text-align: center;
        }
        caption{
            caption-side: bottom;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Ejercicio de una tabla</h2>
    <table>
        
      <tr>
        <td>A</td>
        <td>B</td>
        <td>C</td>
        <td>D</td>
      </tr>
      <tr>
        <td rowspan="2">E, I</td>
        <td>F</td>
        <td colspan="2">G, H</td>
      </tr>
      <tr>
        <td>J</td>
        <td rowspan="2">K, O</td>
        <td>L</td>
      </tr>
      <tr>
        <td>M</td>
        <td>N</td>
        <td>P</td>
      </tr>
      <caption>CAPTION DE LA TABLA</caption>
    </table>
</body>
</html>
